<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Genshin Impact</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#222c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/jpeg" href="./icons/icon-192.jpg">
</head>
<body>
    <div class="container">
        <h1>✨ Calculadora de tiradas</h1>
        <p>Calcula tus tiradas en Genshin Impact.</p>

        <form id="formulario">
            <h3>Recursos disponibles</h3>

            <label>
                <img src="img/Protogemas.webp" class="icono" alt="Protogemas">
                Protogemas
            </label>
            <input type="number" id="protogemas" min="0" step="1" placeholder="Introduce tus protogemas" required>

            <label>
                <img src="img/Deseos.webp" class="icono" alt="Deseos">
                Deseos disponibles
            </label>
            <input type="number" id="deseos" min="0" step="1" placeholder="Introduce tus deseos" required>

            <label>
                <img src="img/Brillo_estelar.webp" class="icono" alt="Brillo estelar">
                Brillo estelar
            </label>
            <input type="number" id="brillo" min="0" step="1" placeholder="Introduce tu brillo" required>

            <label>
                <img src="img/Brillo_estelar.webp" class="icono" alt="Brillo estelar">
                Brillo que quieres reservar (opcional)
            </label>
            <input type="number" id="brilloReservado" min="0" step="1" placeholder="Cantidad que quieres guardar">

            <h3>Estado del banner</h3>

            <label>Pity actual de 4 estrellas</label>
            <input type="number" id="pity4" min="0" max="9" step="1" placeholder="Introduce tu pity de 4★" required>
            <small>Tiradas desde tu último 4 estrellas (0-9).</small>

            <button type="submit">Calcular tiradas</button>
        </form>

        <div id="resultado" class="resultado oculto">
            <h2>Resultados de la simulación</h2>
            <div id="resumenPity"></div>
            <div id="resultadosEscenarios" class="escenarios"></div>
        </div>
    </div>
    <script src="calculadora.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js")
                .catch(error => console.error("Error PWA:", error));
        });
    }
</script>
</body>
</html>
